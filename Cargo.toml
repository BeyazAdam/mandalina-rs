[package]
name = "mandalina-rs"
version = "0.1.0"
edition = "2021"
# tray-icon / muda 0.26 tarafından belirlenir.
rust-version = "1.90"
authors = ["BeyazAdam"]
description = "Offline, tray-based image & PDF compressor and converter with a Shift+drag format wheel"
license = "MIT"
repository = "https://github.com/BeyazAdam/mandalina-rs"
readme = "README.md"
keywords = ["image", "compression", "pdf", "converter", "tray"]
categories = ["multimedia::images", "command-line-utilities"]
publish = false

[[bin]]
name = "mandalina"
path = "src/main.rs"

[dependencies]
# Hata yönetimi
anyhow = "1.0.104"
thiserror = "2.0.21"

# Görsel işleme: yalnızca ihtiyaç duyulan codec'ler (daha küçük ikili, daha hızlı derleme)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "ico", "avif"] }

# PDF ayrıştırma ve yeniden yazma
lopdf = "0.46.0"

# Sistem tepsisi (muda menüleri `tray_icon::menu` altında yeniden dışa aktarılır)
# ve tepsinin ihtiyaç duyduğu platform olay döngüsü
tray-icon = "0.26.1"
tao = "0.37.2"

# Klasör izleme. `notify` crate'ini doğrudan eklemiyoruz; sürüm uyuşmazlığı
# olmaması için debouncer'ın yeniden dışa aktardığı `notify_debouncer_full::notify` kullanılıyor.
notify-debouncer-full = "0.7.0"

# Pano, bildirimler, paralel işleme, dosya seçim pencereleri
arboard = "3.7.0"
notify-rust = "4.18.2"
rayon = "1.12.0"
rfd = "0.17.2"

# Yardımcılar
dirs = "7.0.0"
log = "0.4.34"
env_logger = "0.11.11"

# Shift + sürükle çarkı: vektör çizim ve metin
tiny-skia = "0.12.0"
ab_glyph = "0.2.32"

[target.'cfg(windows)'.dependencies]
# Katmanlı (per-pixel alfa) çark penceresi, OLE bırakma hedefi, Shift tetikleyici
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[target.'cfg(windows)'.build-dependencies]
# exe simgesi ve "Yapımcı: BeyazAdam" sürüm bilgisi (build.rs)
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Hata ayıklama derlemelerinde bile görsel codec'leri optimize et;
# aksi halde JPEG/PNG kodlama 10-50 kat yavaş çalışır.
[profile.dev.package."*"]
opt-level = 3
