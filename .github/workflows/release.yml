name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "mandalina-${{ github.event.release.tag_name }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/mandalina.exe, README.md, LICENSE -Destination $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"

      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "mandalina-${{ github.event.release.tag_name }}-windows-x64.zip" --clobber
